name: pixel_rpg
description: Minimal Flutter foundation for a mobile pixel RPG.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.9.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^18.0.0
  qr_flutter: ^4.1.0
  riverpod: ^2.6.1
  share_plus: ^12.0.1
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/ndas-logo.png
    - assets/ui/icon-atlas.png
    - assets/scenes/daylight-village.png
    - assets/scenes/forest-arena.png
    - assets/sprites/
    - assets/sprites/characters/lantern-courier.png
  fonts:
    - family: GameRoboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 600
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
